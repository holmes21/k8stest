apiVersion: apps/v1
   kind: Deployment
   metadata: { name: whoami-gitops }
   spec:
     replicas: 1
     selector: { matchLabels: { app: whoami-gitops } }
     template:
       metadata: { labels: { app: whoami-gitops } }
       spec: { containers: [{ name: whoami, image: docker.io/traefik/whoami:v1.10.2 }]
